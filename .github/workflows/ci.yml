name: CI

# The VS Code extension and the IntelliJ plugin (hibou ADR-042). The language
# server they drive, `hibou lsp`, ships with hibou (hibouhq/hibou); the
# `compat` job checks the handshake against the latest hibou release
# (PROTOCOL.md).
#
# Releases are in release.yml, which runs these same jobs with the version
# taken from the tag.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z); empty for a regular CI build.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ inputs.version == '' }}

jobs:
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Set the release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Package VSIX
        run: |
          npm run package
          mv hibou-*.vsix hibou-vscode.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hibou-vscode
          path: vscode/hibou-vscode.vsix
          retention-days: 14

  jetbrains:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetbrains
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.1"
      - name: Test and build
        env:
          VERSION: ${{ inputs.version }}
        run: gradle --no-daemon test buildPlugin ${VERSION:+-PpluginVersion=$VERSION}
      # Static API check against every supported IDE release; it downloads
      # each IDE, so it runs on releases only.
      - name: Verify against supported IDEs
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: gradle --no-daemon verifyPlugin -PpluginVersion="$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hibou-intellij
          path: jetbrains/build/distributions/*.zip
          retention-days: 14

  compat:
    runs-on: ubuntu-latest
    env:
      # hibouhq/hibou is public: the workflow token reads its releases.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Latest hibou release
        run: |
          # The newest release whose binaries are uploaded: a release that was
          # just published has none until hibou's CI attaches them.
          tag=$(gh api repos/hibouhq/hibou/releases --jq '[.[] | select(any(.assets[]; .name == "hibou-linux-amd64"))][0].tag_name')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::no hibou release with hibou-linux-amd64"
            exit 1
          fi
          echo "Checking against hibou $tag"
          gh release download "$tag" --repo hibouhq/hibou --pattern hibou-linux-amd64 --dir "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/hibou-linux-amd64"
          node scripts/compat.mjs "$RUNNER_TEMP/hibou-linux-amd64"
